<style>
  .container {
    padding: 1.5rem 0;
  }

  .label {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
  }

  .textarea-wrap {
    position: relative;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 120px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 12px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    line-height: 1.5;
  }

  textarea:focus {
    outline: none;
    border-color: var(--color-border-primary);
    box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.15);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin: 12px 0;
    flex-wrap: wrap;
  }

  button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--border-radius-md);
    font-weight: 500;
    background: transparent;
    border: 0.5px solid var(--color-border-secondary);
    color: var(--color-text-primary);
    transition: background 0.15s;
  }

  button:hover {
    background: var(--color-background-secondary);
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: var(--color-background-info);
    color: var(--color-text-info);
    border-color: transparent;
  }

  button.primary:hover {
    opacity: 0.9;
  }

  .error-msg {
    font-size: 13px;
    color: var(--color-text-danger);
    background: var(--color-background-danger);
    border: 0.5px solid var(--color-border-danger);
    border-radius: var(--border-radius-md);
    padding: 8px 12px;
    margin-top: 8px;
    display: none;
  }

  .pdf-frame-wrap {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    background: var(--color-background-secondary);
    display: none;
    margin-top: 12px;
  }

  .pdf-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
  }

  .pdf-toolbar span {
    font-size: 13px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  iframe {
    width: 100%;
    height: 520px;
    border: none;
    display: block;
    background: #fff;
  }

  .drop-zone {
    border: 1.5px dashed var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 20px 16px;
    text-align: center;
    color: var(--color-text-secondary);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: background 0.15s;
  }

  .drop-zone:hover {
    background: var(--color-background-secondary);
  }

  .drop-zone.dragover {
    background: var(--color-background-info);
    border-color: var(--color-border-info);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }

  .divider span {
    font-size: 12px;
    color: var(--color-text-tertiary);
    white-space: nowrap;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--color-border-tertiary);
  }
</style>

<h2 class="sr-only">Base64 PDF Convert and to PDF and Signing</h2>

<div class="container">
  <div class="drop-zone" id="dropZone">
    <i class="ti ti-upload" style="font-size:22px; margin-bottom:6px; display:block;" aria-hidden="true"></i>
    Drag & drop a PDF file here, or click to upload
    <input type="file" id="fileInput" accept=".pdf" style="display:none">
  </div>

  <div class="divider"><span>or paste base64 below</span></div>

  <p class="label">Base64-encoded PDF string</p>
  <div class="textarea-wrap">
    <textarea id="b64input"
      placeholder="Paste your base64 string here (with or without the data:application/pdf;base64, prefix)..."></textarea>
  </div>

  <div class="actions">
    <button class="primary" id="renderBtn">
      <i class="ti ti-eye" aria-hidden="true"></i> Render PDF
    </button>
    <button id="clearBtn">
      <i class="ti ti-x" aria-hidden="true"></i> Clear
    </button>
    <button id="downloadBtn" style="display:none">
      <i class="ti ti-download" aria-hidden="true"></i> Download PDF
      <!-- import pdf -->
    </button>
    <button id="signBtn" style="display:none; border-color: transparent; background: #e07a5f; color: white;">
      <i class="ti ti-pencil" aria-hidden="true"></i> Sign PDF
    </button>
    <!-- import pdf end -->
  </div>

  <div class="error-msg" id="errMsg"></div>

  <div class="pdf-frame-wrap" id="pdfWrap">
    <div class="pdf-toolbar">
      <span><i class="ti ti-file" style="font-size:16px" aria-hidden="true"></i> <span id="fileLabel">PDF
          preview</span></span>
      <span id="sizeLabel" style="font-size:12px;"></span>
    </div>
    <iframe id="pdfFrame" title="PDF preview"></iframe>
  </div>
</div>

<script>
  //import pdf
  var webSocket1 = new WebSocket('ws://localhost:1818');
  var webSocket = new WebSocket('ws://localhost:2828');
  let currentPdfFilePath = '';

  function TouchSign() {
    if (!currentPdfFilePath) {
      showError("Please load a base64 PDF first before signing.");
      return;
    }
    webSocket.send("TouchSign(" + currentPdfFilePath + ",0)");
  }
  //load siged pdf as a base64
  webSocket.onmessage = function (event) {
    if (event.data.indexOf('BeginAfterSign') >= 0) {
      var newLogMsg = event.data.replace('BeginAfterSign', '').replace('EndAfterSign', '');
      try {
        let jsondata = JSON.parse(newLogMsg);
        if (jsondata.signFileStr) {
          console.log("Signed PDF Base64 string:");
          console.log(jsondata.signFileStr);

          let binary = atob(jsondata.signFileStr);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const blob = new Blob([bytes], { type: 'application/pdf' });

          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = URL.createObjectURL(blob);

          document.getElementById('pdfFrame').src = currentBlobUrl;
          document.getElementById('fileLabel').textContent = "Signed PDF preview";
        }
      } catch (e) {
        console.error("Error parsing signature response or displaying PDF", e);
      }
      webSocket.send("GWQ_StopWrite()");
    }
  };
  //import pdf end
  const b64input = document.getElementById('b64input');
  const renderBtn = document.getElementById('renderBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  //import pdf
  const signBtn = document.getElementById('signBtn');
  signBtn.addEventListener('click', TouchSign);
  //import pdf end
  const pdfWrap = document.getElementById('pdfWrap');
  const pdfFrame = document.getElementById('pdfFrame');
  const errMsg = document.getElementById('errMsg');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const sizeLabel = document.getElementById('sizeLabel');

  let currentBlobUrl = null;

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.style.display = 'block';
    pdfWrap.style.display = 'none';
    downloadBtn.style.display = 'none';
    signBtn.style.display = 'none';
  }

  function hideError() {
    errMsg.style.display = 'none';
  }

  function renderBase64(b64, name) {
    hideError();
    let clean = b64.trim();
    if (clean.startsWith('data:')) {
      const commaIdx = clean.indexOf(',');
      if (commaIdx === -1) { showError('Invalid data URL format.'); return; }
      clean = clean.slice(commaIdx + 1);
    }
    clean = clean.replace(/\s/g, '');
    if (!clean) { showError('Input is empty. Paste a base64 string first.'); return; }

    let binary;
    try {
      binary = atob(clean);
    } catch (e) {
      showError('Invalid base64 string. Make sure it is properly encoded and contains no spaces or line breaks.');
      return;
    }

    if (!binary.startsWith('%PDF') && !binary.startsWith('ÿó') && !clean.slice(0, 8).includes('JVBERi0')) {
      const header = clean.slice(0, 8);
      if (header !== 'JVBERi0' && !binary.startsWith('%PDF')) {
        showError('This does not appear to be a PDF file. Make sure the base64 encodes a valid PDF.');
        return;
      }
    }

    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/pdf' });

    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(blob);

    pdfFrame.src = currentBlobUrl;
    pdfWrap.style.display = 'block';
    downloadBtn.style.display = 'flex';
    //import
    signBtn.style.display = 'flex';

    let uniqueId = new Date().getTime();
    currentPdfFilePath = "d:\\Klassmate_Base64_Test_" + uniqueId + ".pdf";
    if (webSocket1.readyState === WebSocket.OPEN) {
      webSocket1.send('Base64Decode(' + currentPdfFilePath + ',' + clean + ')');
    } else {
      let checkWs = setInterval(() => {
        if (webSocket1.readyState === WebSocket.OPEN) {
          webSocket1.send('Base64Decode(' + currentPdfFilePath + ',' + clean + ')');
          clearInterval(checkWs);
        }
      }, 500);
    }

    fileLabel.textContent = name || 'PDF preview';
    const kb = (blob.size / 1024).toFixed(1);
    sizeLabel.textContent = kb < 1000 ? kb + ' KB' : (blob.size / 1048576).toFixed(2) + ' MB';

    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = currentBlobUrl;
      a.download = (name || 'document') + (name && name.endsWith('.pdf') ? '' : '.pdf');
      a.click();
    };
  }

  renderBtn.addEventListener('click', () => renderBase64(b64input.value));

  clearBtn.addEventListener('click', () => {
    b64input.value = '';
    pdfWrap.style.display = 'none';
    downloadBtn.style.display = 'none';
    signBtn.style.display = 'none';
    hideError();
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  });

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

  function handleFile(file) {
    if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
      showError('Please select a PDF file.'); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      const b64 = dataUrl.split(',')[1];
      b64input.value = b64;
      renderBase64(b64, file.name);
    };
    reader.readAsDataURL(file);
  }

  b64input.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') renderBase64(b64input.value);
  });
</script>
